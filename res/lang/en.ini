help.mouse=Mouse: wheel = next/previous file, Ctrl + wheel = zoom, left drag = scroll, double-click = full screen,\nright click = menu, wheel click = exit, X1 drag = zoom, X2 = actual size / fit, Ctrl + drag = move window.\nMulti-page TIFF: Space / BackSpace turn pages, Ctrl + ← / → jump between pages.
about.short=Fast single-window image viewer with built-in TIFF support
about.text=Fast single-window image viewer.\nTIFF (multi-page, LZW, ZIP, PackBits, JPEG, CCITT G3/G4, 16-bit, alpha), JPEG, PNG, GIF (animated), BMP, ICO, JPEG XR and any other format with a Windows codec (WebP, HEIF, RAW ...) are read directly without plug-ins.
about.license=ZIP reading uses miniz (MIT licence, (c) Rich Geldreich, RAD Game Tools, Valve Software).
formats.intro=Formats are provided by the Windows Imaging Component. Installing codecs from the Microsoft Store (e.g. HEIF, WebP, Raw) adds more formats automatically.
