help.intro=Lviewer — รายการปุ่มลัดและเมาส์ (เปลี่ยนได้ที่ อื่นๆ > ตั้งค่าแป้นพิมพ์ / ตั้งค่าเมาส์)
help.hidden=ฟังก์ชันที่ไม่อยู่ในเมนู
help.mouse=เมาส์: ล้อเลื่อน = ไฟล์ถัดไป/ก่อนหน้า, Ctrl + ล้อเลื่อน = ซูม, ลากซ้าย = เลื่อน, ดับเบิลคลิก = เต็มจอ,\nคลิกขวา = เมนู, คลิกล้อเลื่อน = ออก, ลาก X1 = ซูม, X2 = ขนาดจริง/พอดี, Ctrl + ลาก = ย้ายหน้าต่าง\nTIFF หลายหน้า: Space / BackSpace เปลี่ยนหน้า, Ctrl + ← / → ไปหน้าก่อน/ถัดไป
about.short=โปรแกรมดูรูปหน้าต่างเดียวที่รวดเร็ว รองรับ TIFF ในตัว
about.text=โปรแกรมดูรูปหน้าต่างเดียวที่รวดเร็ว\nอ่าน TIFF (หลายหน้า, LZW, ZIP, PackBits, JPEG, CCITT G3/G4, 16 บิต, โปร่งใส), JPEG, PNG, GIF (แอนิเมชัน), BMP, ICO, JPEG XR และรูปแบบอื่นที่มีตัวแปลงสัญญาณใน Windows (WebP, HEIF, RAW ฯลฯ) ได้โดยตรงโดยไม่ต้องใช้ปลั๊กอิน
