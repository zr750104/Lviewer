name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty for a normal build."
        required: false
        default: ""

jobs:
  windows-msvc:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Lviewer-win64
          path: build/Release/Lviewer.exe
      - name: Package ZIP
        shell: pwsh
        run: |
          $ver = "${{ inputs.release_tag }}"
          if (-not $ver) { $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" } }
          "LV_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force pkg/Lviewer/lang | Out-Null
          Copy-Item build/Release/Lviewer.exe pkg/Lviewer/
          Copy-Item res/lang/*.ini pkg/Lviewer/lang/
          Copy-Item README.md pkg/Lviewer/
          Copy-Item third_party/miniz/LICENSE pkg/Lviewer/LICENSE-miniz.txt
          Compress-Archive -Path pkg/Lviewer -DestinationPath "Lviewer-$ver-win64.zip" -Force
          Get-ChildItem -Recurse pkg | Select-Object FullName, Length | Format-Table -AutoSize
      - name: Create GitHub Release (tag push or manual run with release_tag)
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:LV_VER" "Lviewer-$env:LV_VER-win64.zip" --target "${{ github.sha }}" `
            --title "Lviewer $env:LV_VER" `
            --notes "Windows 10/11 64bit。ZIPを展開して Lviewer.exe を起動（インストール不要）。TIFF（マルチページ・LZW・ZIP・PackBits・JPEG・CCITT G3/G4）を標準対応。表示言語: 日本語 / English / ไทย。"

  linux-tests-and-mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          cmake -S . -B build-test -DLVIEWER_TESTS=ON
          cmake --build build-test -j
          cd build-test && ctest --output-on-failure
      - name: Language files are up to date
        run: |
          python3 tools/gen_lang.py
          git diff --exit-code res/lang
      - name: Cross build (MinGW-w64)
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64
          cmake -S . -B build-mingw -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw -j
      - uses: actions/upload-artifact@v4
        with:
          name: Lviewer-win64-mingw
          path: build-mingw/Lviewer.exe
